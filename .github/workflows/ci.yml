name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: gofmt
        if: runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      # The race detector needs cgo; Linux runners ship with gcc. On
      # failure, the failing tests and race reports are also published as
      # one annotation: annotations are readable without signing in,
      # unlike job logs.
      - name: go test -race
        if: runner.os == 'Linux'
        run: |
          set -o pipefail
          if ! go test -race -count=3 ./... 2>&1 | tee race.log; then
            excerpt=$(awk '/WARNING: DATA RACE/ {n=40} n>0 {print; n--; next} /^(--- FAIL|FAIL|panic:)|_test\.go:[0-9]+:/ {print}' race.log | head -n 150)
            excerpt=${excerpt//'%'/'%25'}
            excerpt=${excerpt//$'\r'/}
            excerpt=${excerpt//$'\n'/'%0A'}
            echo "::error title=go test -race failed::${excerpt}"
            exit 1
          fi
